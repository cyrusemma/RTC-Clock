<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-C3 Clock Controller</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a202c">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="dark-mode">
    <div id="ble-warning" class="hidden">
        ⚠️ Web Bluetooth is not supported in this browser. Please use Chrome or Edge over HTTPS or localhost.
    </div>

    <div class="app-container clay-panel">
        <header class="header">
            <div class="connection-status">
                <div id="status-indicator" class="indicator disconnected"></div>
                <span id="status-text">Disconnected</span>
                <span id="device-name" class="hidden"></span>
                <span id="browser-clock" class="digital-font small-text browser-clock-text">This device: --:--:--</span>
            </div>
            <div class="header-controls">
                <!-- V2: Separate WiFi and BLE connection buttons -->
                <button id="wifi-connect-btn" class="clay-btn">WiFi Connect</button>
                <button id="theme-toggle" class="clay-btn icon-btn" title="Toggle Theme">🌓</button>
                <button id="connect-btn" class="clay-btn primary-btn">BLE Connect</button>
            </div>
        </header>

        <main class="views">
            <!-- CLOCK VIEW -->
            <section id="view-clock" class="view active">
                <div class="clay-display clock-display-wrapper">
                    <button id="btn-clock-toggle" class="clay-btn icon-btn clock-toggle-btn" title="Toggle Analogue/Digital">🕐</button>
                    <div id="clock-digital">
                        <div id="clock-time" class="digital-font large-text">00:00:00</div>
                        <div id="clock-date" class="digital-font small-text clock-date-text"></div>
                    </div>
                    <div id="clock-analogue" class="hidden">
                        <div id="analogue-clock-container"></div>
                    </div>
                    <div class="display-footer">
                        <span id="clock-tz">UTC+0</span>
                    </div>
                </div>
                <div class="controls">
                    <button id="btn-sync" class="clay-btn wide-btn">Sync Time</button>
                </div>
                <div class="clay-inset world-clock-container">
                    <h4 class="section-subtitle">World Clock</h4>
                    <div id="world-clock" class="digital-font small-text"></div>
                </div>
            </section>

            <!-- STOPWATCH VIEW -->
            <section id="view-stopwatch" class="view hidden">
                <div class="clay-display">
                    <div id="sw-time" class="digital-font large-text">00:00.00</div>
                    <div id="sw-state" class="state-label">Ready</div>
                </div>
                <div class="controls row">
                    <button id="btn-sw-start" class="clay-btn">Start/Resume</button>
                    <button id="btn-sw-pause" class="clay-btn">Pause</button>
                    <button id="btn-sw-lap" class="clay-btn">Lap</button>
                    <button id="btn-sw-reset" class="clay-btn warning-btn">Reset</button>
                </div>
                <div id="sw-laps-container" class="clay-inset hidden laps-container">
                    <h4 class="section-subtitle-small">Laps</h4>
                    <div id="sw-laps" class="digital-font small-text laps-list"></div>
                </div>
            </section>

            <!-- ALARM VIEW -->
            <section id="view-alarm" class="view hidden">
                <div id="alarm-ringing-banner" class="clay-banner hidden">
                    <span>Alarm is Ringing!</span>
                    <button id="btn-alarm-snooze" class="clay-btn">Snooze (5m)</button>
                    <button id="btn-alarm-dismiss" class="clay-btn danger-btn">Dismiss</button>
                </div>
                
                <!-- V2: 4-Slot Alarm Cards -->
                <div id="alarm-cards-container" class="alarm-cards-container">
                    <!-- Injected by ui.js -->
                </div>

                <!-- Editor (shown when a card is clicked) -->
                <div id="alarm-editor" class="clay-inset hidden alarm-editor-container">
                    <h4 class="section-subtitle">Edit Alarm <span id="alarm-edit-slot-label"></span></h4>
                    
                    <div class="picker-row">
                        <div class="picker-col">
                            <label class="picker-label">Hour</label>
                            <div id="alarm-picker-hour" class="scroll-picker" data-min="0" data-max="23"></div>
                            <div id="alarm-hour-display" class="picker-value">00</div>
                        </div>
                        <div class="picker-sep">:</div>
                        <div class="picker-col">
                            <label class="picker-label">Minute</label>
                            <div id="alarm-picker-min" class="scroll-picker" data-min="0" data-max="59"></div>
                            <div id="alarm-min-display" class="picker-value">00</div>
                        </div>
                    </div>
                    
                    <div class="repeat-days repeat-days-container" id="alarm-repeat-days">
                        <button class="clay-btn small-btn day-btn" data-day="0">S</button>
                        <button class="clay-btn small-btn day-btn" data-day="1">M</button>
                        <button class="clay-btn small-btn day-btn" data-day="2">T</button>
                        <button class="clay-btn small-btn day-btn" data-day="3">W</button>
                        <button class="clay-btn small-btn day-btn" data-day="4">T</button>
                        <button class="clay-btn small-btn day-btn" data-day="5">F</button>
                        <button class="clay-btn small-btn day-btn" data-day="6">S</button>
                    </div>

                    <div class="controls row controls-mt-10">
                        <button id="btn-alarm-cancel" class="clay-btn">Cancel</button>
                        <button id="btn-alarm-set" class="clay-btn primary-btn">✔ Save Alarm</button>
                    </div>
                </div>
            </section>

            <!-- TIMER VIEW -->
            <section id="view-timer" class="view hidden">
                <div id="timer-ringing-banner" class="clay-banner hidden">
                    <span>Timer is Ringing!</span>
                    <button id="btn-timer-stop" class="clay-btn danger-btn">Stop</button>
                </div>
                <div class="clay-display timer-ring-display">
                    <div id="timer-ring-container"></div>
                    <div class="timer-ring-overlay">
                        <div id="timer-time" class="digital-font large-text">00:00.00</div>
                        <div id="timer-state" class="state-label">Ready</div>
                    </div>
                </div>
                <!-- Scroll Pickers -->
                <div class="picker-row">
                    <div class="picker-col">
                        <label class="picker-label">Min</label>
                        <div id="timer-picker-min" class="scroll-picker" data-min="0" data-max="99"></div>
                        <div id="timer-min-display" class="picker-value">00</div>
                    </div>
                    <div class="picker-sep">:</div>
                    <div class="picker-col">
                        <label class="picker-label">Sec</label>
                        <div id="timer-picker-sec" class="scroll-picker" data-min="0" data-max="59"></div>
                        <div id="timer-sec-display" class="picker-value">00</div>
                    </div>
                </div>
                <div class="controls row controls-mt-10">
                    <button id="btn-timer-set" class="clay-btn primary-btn">✔ Set Timer</button>
                </div>
                <div class="controls row controls-mt-8">
                    <button id="btn-timer-cycle" class="clay-btn">Cycle Field</button>
                    <button id="btn-timer-up" class="clay-btn icon-btn">▲</button>
                    <button id="btn-timer-down" class="clay-btn icon-btn">▼</button>
                </div>
            </section>
        </main>

        <!-- V2 Mobile Bottom Navigation -->
        <nav class="mode-tabs bottom-nav">
            <button class="clay-tab active" data-mode="0">
                <span class="nav-icon">⌚</span>
                <span class="nav-text">Clock</span>
            </button>
            <button class="clay-tab" data-mode="1">
                <span class="nav-icon">⏱️</span>
                <span class="nav-text">Stopwatch</span>
            </button>
            <button class="clay-tab" data-mode="2">
                <span class="nav-icon">⏰</span>
                <span class="nav-text">Alarm</span>
            </button>
            <button class="clay-tab" data-mode="3">
                <span class="nav-icon">⏳</span>
                <span class="nav-text">Timer</span>
            </button>
        </nav>

        <footer class="activity-log">
            <h4>Activity Log</h4>
            <div id="log-content" class="clay-inset digital-font small-text"></div>
        </footer>
    </div>

    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
