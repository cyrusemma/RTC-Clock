<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-C3 Clock Controller</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a202c">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="dark-mode">
    <div id="ble-warning" class="hidden">
        ⚠️ Web Bluetooth is not supported. Use Chrome or Edge over HTTPS or localhost.
    </div>

    <div class="app-container clay-panel">

        <!-- ── HEADER ─────────────────────────────────────── -->
        <header class="header">
            <div class="connection-status">
                <div id="status-indicator" class="indicator disconnected"></div>
                <div class="status-info">
                    <span id="status-text">Disconnected</span>
                    <span id="device-name" class="device-name-text hidden"></span>
                </div>
            </div>

            <div class="header-right">
                <span id="browser-clock" class="digital-font browser-clock-text">--:--:--</span>
                <button id="theme-toggle" class="clay-btn icon-btn" title="Toggle Theme">🌓</button>

                <!-- Connect dropdown -->
                <div class="dropdown-wrap" id="connect-dropdown-wrap">
                    <button id="connect-menu-btn" class="clay-btn primary-btn connect-btn">
                        <span id="connect-btn-icon">⚡</span>
                        <span id="connect-btn-label">Connect</span>
                    </button>
                    <div class="dropdown-menu clay-panel" id="connect-menu" role="menu">
                        <button id="connect-btn" class="dropdown-item" role="menuitem">
                            <span class="di-icon">📡</span> BLE Connect
                        </button>
                        <button id="wifi-connect-btn" class="dropdown-item" role="menuitem">
                            <span class="di-icon">🌐</span> WiFi Connect
                        </button>
                    </div>
                </div>
                <div id="ble-note" class="ble-note hidden"></div>
            </div>
        </header>

        <!-- ── MAIN VIEWS ──────────────────────────────────── -->
        <main class="views">

            <!-- CLOCK VIEW -->
            <section id="view-clock" class="view active">
                <div class="clay-display clock-display-wrapper">
                    <div id="clock-digital">
                        <div id="clock-time" class="digital-font large-text">00:00:00</div>
                        <div id="clock-date" class="digital-font small-text clock-date-text"></div>
                    </div>
                    <div id="clock-analogue" class="hidden">
                        <div id="analogue-clock-container"></div>
                    </div>
                    <div class="display-footer">
                        <span id="clock-tz">UTC+0</span>
                    </div>
                </div>

                <!-- Compact action row -->
                <div class="clock-actions">
                    <button id="btn-sync" class="clay-btn action-btn primary-btn">
                        <span>🔄</span><span>Sync</span>
                    </button>
                    <button id="btn-clock-toggle" class="clay-btn action-btn" title="Toggle Analogue/Digital">
                        <span>🕐</span><span>Style</span>
                    </button>
                    <!-- Clock settings dropdown -->
                    <div class="dropdown-wrap" id="clock-settings-wrap">
                        <button class="clay-btn action-btn" id="clock-settings-btn">
                            <span>⚙️</span><span>Settings</span>
                        </button>
                        <div class="dropdown-menu clay-panel" id="clock-settings-menu" role="menu">
                            <button id="btn-mode-short" class="dropdown-item" role="menuitem">
                                <span class="di-icon">🔁</span> Next Mode
                            </button>
                            <button id="btn-mode-long" class="dropdown-item" role="menuitem">
                                <span class="di-icon">✏️</span> Set Clock
                            </button>
                            <div class="dropdown-divider"></div>
                            <button id="btn-tz-up" class="dropdown-item" role="menuitem">
                                <span class="di-icon">🌍</span> TZ +1 Hour
                            </button>
                            <button id="btn-tz-down" class="dropdown-item" role="menuitem">
                                <span class="di-icon">🌍</span> TZ -1 Hour
                            </button>
                        </div>
                    </div>
                </div>

                <!-- World Clock — collapsible -->
                <details class="collapsible-section">
                    <summary class="collapsible-summary">🌐 World Clock</summary>
                    <div id="world-clock" class="digital-font small-text world-clock-inner"></div>
                </details>
            </section>

            <!-- STOPWATCH VIEW -->
            <section id="view-stopwatch" class="view hidden">
                <div class="clay-display">
                    <div id="sw-time" class="digital-font large-text">00:00.00</div>
                    <div id="sw-state" class="state-label">Ready</div>
                </div>
                <div class="sw-actions">
                    <button id="btn-sw-start" class="clay-btn action-btn primary-btn">
                        <span>▶</span><span>Start</span>
                    </button>
                    <button id="btn-sw-pause" class="clay-btn action-btn">
                        <span>⏸</span><span>Pause</span>
                    </button>
                    <button id="btn-sw-lap" class="clay-btn action-btn">
                        <span>🏁</span><span>Lap</span>
                    </button>
                    <button id="btn-sw-reset" class="clay-btn action-btn warning-btn">
                        <span>↺</span><span>Reset</span>
                    </button>
                </div>

                <!-- Laps — collapsible -->
                <div id="sw-laps-container" class="hidden">
                    <details class="collapsible-section" open>
                        <summary class="collapsible-summary">🏁 Laps</summary>
                        <div id="sw-laps" class="digital-font small-text laps-list"></div>
                    </details>
                </div>
            </section>

            <!-- ALARM VIEW -->
            <section id="view-alarm" class="view hidden">
                <div id="alarm-ringing-banner" class="clay-banner hidden">
                    <span>🔔 Alarm Ringing!</span>
                    <div class="banner-actions">
                        <button id="btn-alarm-snooze" class="clay-btn small-btn">💤 Snooze</button>
                        <button id="btn-alarm-dismiss" class="clay-btn small-btn danger-btn">✕ Dismiss</button>
                    </div>
                </div>

                <!-- 4-Slot Alarm Cards -->
                <div id="alarm-cards-container" class="alarm-cards-container">
                    <!-- Injected by ui.js -->
                </div>

                <!-- Editor (shown when a card is clicked) -->
                <div id="alarm-editor" class="clay-inset hidden alarm-editor-container">
                    <div class="alarm-editor-header">
                        <h4 class="section-subtitle">Edit Alarm <span id="alarm-edit-slot-label"></span></h4>
                        <button id="alarm-enabled-toggle" class="clay-btn small-btn" title="Toggle enabled">ON</button>
                    </div>

                    <div class="picker-row">
                        <div class="picker-col">
                            <label class="picker-label">Hour</label>
                            <div id="alarm-picker-hour" class="scroll-picker" data-min="0" data-max="23"></div>
                            <div id="alarm-hour-display" class="picker-value">00</div>
                        </div>
                        <div class="picker-sep">:</div>
                        <div class="picker-col">
                            <label class="picker-label">Minute</label>
                            <div id="alarm-picker-min" class="scroll-picker" data-min="0" data-max="59"></div>
                            <div id="alarm-min-display" class="picker-value">00</div>
                        </div>
                    </div>

                    <!-- Repeat days -->
                    <div class="repeat-days repeat-days-container" id="alarm-repeat-days">
                        <button class="clay-btn small-btn day-btn" data-day="0">Su</button>
                        <button class="clay-btn small-btn day-btn" data-day="1">Mo</button>
                        <button class="clay-btn small-btn day-btn" data-day="2">Tu</button>
                        <button class="clay-btn small-btn day-btn" data-day="3">We</button>
                        <button class="clay-btn small-btn day-btn" data-day="4">Th</button>
                        <button class="clay-btn small-btn day-btn" data-day="5">Fr</button>
                        <button class="clay-btn small-btn day-btn" data-day="6">Sa</button>
                    </div>

                    <div class="controls row controls-mt-10">
                        <button id="btn-alarm-cancel" class="clay-btn">✕ Cancel</button>
                        <button id="btn-alarm-set" class="clay-btn primary-btn">✔ Save</button>
                    </div>
                </div>
            </section>

            <!-- TIMER VIEW -->
            <section id="view-timer" class="view hidden">
                <div id="timer-ringing-banner" class="clay-banner hidden">
                    <span>⏰ Timer Done!</span>
                    <button id="btn-timer-stop" class="clay-btn small-btn danger-btn">✕ Stop</button>
                </div>

                <div class="clay-display timer-ring-display">
                    <div id="timer-ring-container"></div>
                    <div class="timer-ring-overlay">
                        <div id="timer-time" class="digital-font large-text">00:00.00</div>
                        <div id="timer-state" class="state-label">Ready</div>
                    </div>
                </div>

                <!-- Scroll Pickers -->
                <div class="picker-row">
                    <div class="picker-col">
                        <label class="picker-label">Min</label>
                        <div id="timer-picker-min" class="scroll-picker" data-min="0" data-max="99"></div>
                        <div id="timer-min-display" class="picker-value">00</div>
                    </div>
                    <div class="picker-sep">:</div>
                    <div class="picker-col">
                        <label class="picker-label">Sec</label>
                        <div id="timer-picker-sec" class="scroll-picker" data-min="0" data-max="59"></div>
                        <div id="timer-sec-display" class="picker-value">00</div>
                    </div>
                </div>

                <div class="controls-mt-10">
                    <button id="btn-timer-set" class="clay-btn wide-btn primary-btn">✔ Set Timer</button>
                </div>

                <!-- Manual Adjust — collapsible (for physical button mirroring) -->
                <details class="collapsible-section controls-mt-8">
                    <summary class="collapsible-summary">🎛 Manual Adjust</summary>
                    <div class="timer-manual-row">
                        <button id="btn-timer-cycle" class="clay-btn action-btn">
                            <span>🔁</span><span>Field</span>
                        </button>
                        <button id="btn-timer-up" class="clay-btn action-btn">
                            <span>▲</span><span>Up</span>
                        </button>
                        <button id="btn-timer-down" class="clay-btn action-btn">
                            <span>▼</span><span>Down</span>
                        </button>
                    </div>
                </details>
            </section>
        </main>

        <!-- ── BOTTOM NAV ───────────────────────────────────── -->
        <nav class="mode-tabs bottom-nav">
            <button class="clay-tab active" data-mode="0" onclick="window.selectMode && window.selectMode(0)">
                <span class="nav-icon">⌚</span>
                <span class="nav-text">Clock</span>
            </button>
            <button class="clay-tab" data-mode="1" onclick="window.selectMode && window.selectMode(1)">
                <span class="nav-icon">⏱️</span>
                <span class="nav-text">Stopwatch</span>
            </button>
            <button class="clay-tab" data-mode="2" onclick="window.selectMode && window.selectMode(2)">
                <span class="nav-icon">⏰</span>
                <span class="nav-text">Alarm</span>
            </button>
            <button class="clay-tab" data-mode="3" onclick="window.selectMode && window.selectMode(3)">
                <span class="nav-icon">⏳</span>
                <span class="nav-text">Timer</span>
            </button>
        </nav>

        <!-- ── ACTIVITY LOG — collapsible drawer ────────────── -->
        <details class="activity-log-drawer" id="log-drawer">
            <summary class="log-drawer-summary">📋 Activity Log</summary>
            <div id="log-content" class="clay-inset digital-font small-text log-content"></div>
        </details>

    </div>

    <script type="module" src="js/app.js?v=4"></script>
</body>
</html>
